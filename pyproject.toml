[project]
name = "tiny-agents-agent"
version = "0.1.0"
description = "The coding agent built block by block across the Tiny Agents lessons."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0,<2"]

# WITHOUT a build-system, uv treats this as a non-package project and installs
# only the dependencies — `agent/` would not be importable. With it, the project
# is installed editable, which is why `import agent.v0` works.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package directory name (`agent`) differs from the project name, so hatch
# needs it spelled out. Every version dir (v0, v0_2, …) and the shared harness
# live under it and ship together.
[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = ["pytest>=8"]
